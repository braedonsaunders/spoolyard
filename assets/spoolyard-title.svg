<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-label="Spoolyard — piping isometrics and spool fabrication">
  <title>Spoolyard</title>
  <defs>
    <radialGradient id="bg" cx="30%" cy="35%" r="90%">
      <stop offset="0" stop-color="#0f3f55"/>
      <stop offset="0.6" stop-color="#081a26"/>
      <stop offset="1" stop-color="#050f17"/>
    </radialGradient>
    <linearGradient id="route" x1="0" x2="1">
      <stop offset="0" stop-color="#5ce1f0"/>
      <stop offset="1" stop-color="#16b3c9"/>
    </linearGradient>
    <linearGradient id="word" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bff3fb"/>
    </linearGradient>
    <clipPath id="tile"><rect width="880" height="240" rx="22"/></clipPath>
  </defs>
  <style>
    .grid line { stroke: #1d5a72; stroke-width: 0.7; opacity: .45 }
    .pipe { fill: none; stroke: url(#route); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round;
            stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 6s cubic-bezier(.6,.05,.25,1) infinite }
    .flange { fill: none; stroke: #5ce1f0; stroke-width: 7; stroke-linecap: round; opacity: 0; animation: flange 6s ease infinite }
    .weld { fill: #e8fbff; opacity: 0; transform-box: fill-box; transform-origin: center; animation: weld 6s ease infinite }
    .w2 { animation-delay: .18s } .w3 { animation-delay: .36s }
    .word { font: 700 64px "Segoe UI", -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif; letter-spacing: -1.5px; fill: url(#word) }
    .tag { font: 600 14px "Segoe UI", -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif; letter-spacing: 3px; fill: #8fd3e2 }
    .dim { font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #5ce1f0; opacity: 0; animation: dim 6s ease infinite }
    @keyframes draw { 0% { stroke-dashoffset: 1 } 22% { stroke-dashoffset: 0 } 88% { stroke-dashoffset: 0; opacity: 1 } 96% { opacity: 0 } 100% { stroke-dashoffset: 1; opacity: 0 } }
    @keyframes flange { 0%, 20% { opacity: 0 } 26%, 88% { opacity: 1 } 96%, 100% { opacity: 0 } }
    @keyframes weld { 0%, 14% { opacity: 0; transform: scale(.2) } 20% { opacity: 1; transform: scale(1.5) } 24%, 88% { opacity: 1; transform: scale(1) } 96%, 100% { opacity: 0 } }
    @keyframes dim { 0%, 26% { opacity: 0 } 32%, 88% { opacity: .9 } 96%, 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .pipe, .flange, .weld, .dim { animation: none; opacity: 1; stroke-dashoffset: 0 } }
  </style>
  <g clip-path="url(#tile)">
    <rect width="880" height="240" fill="url(#bg)"/>
    <g class="grid">
      <line x1="-60" y1="240" x2="356" y2="0"/><line x1="0" y1="240" x2="416" y2="0"/><line x1="60" y1="240" x2="476" y2="0"/>
      <line x1="120" y1="240" x2="536" y2="0"/><line x1="180" y1="240" x2="596" y2="0"/><line x1="240" y1="240" x2="656" y2="0"/>
      <line x1="-160" y1="0" x2="256" y2="240"/><line x1="-100" y1="0" x2="316" y2="240"/><line x1="-40" y1="0" x2="376" y2="240"/>
      <line x1="20" y1="0" x2="436" y2="240"/><line x1="80" y1="0" x2="496" y2="240"/><line x1="140" y1="0" x2="556" y2="240"/>
      <line x1="60" y1="0" x2="60" y2="240"/><line x1="120" y1="0" x2="120" y2="240"/><line x1="180" y1="0" x2="180" y2="240"/><line x1="240" y1="0" x2="240" y2="240"/>
    </g>
    <g transform="translate(22 -6)">
    <path class="pipe" pathLength="1" d="M52 160 L118 198 L118 92 L204 142 L270 104"/>
    <path class="flange" d="M57 151.3 L47 168.7 M265 95.3 L275 112.7"/>
    <circle class="weld" cx="118" cy="198" r="6"/>
    <circle class="weld w2" cx="118" cy="92" r="6"/>
    <circle class="weld w3" cx="204" cy="142" r="6"/>
    <text class="dim" x="130" y="150">1200</text>
    <text class="dim" x="168" y="108">900</text>
    </g>
    <text class="word" x="330" y="128">Spoolyard</text>
    <text class="tag" x="334" y="164">PIPING ISOMETRICS · SPOOL FABRICATION</text>
  </g>
</svg>
